<h2 mat-dialog-title>Dialog with elements</h2>
<mat-form-field appearance="outline">
  <mat-label>Film Title</mat-label>
  <input matInput placeholder="Terminator" />
</mat-form-field>
<mat-form-field appearance="outline">
  <mat-label>Rating</mat-label>
  <input matInput placeholder="R" />
</mat-form-field>
<mat-form-field appearance="outline">
  <mat-label>Genre</mat-label>
  <input matInput placeholder="Action" />
</mat-form-field>
<mat-form-field appearance="outline">
  <mat-label>Tags</mat-label>
  <input matInput placeholder="Robot, Arnold" />
</mat-form-field>
<mat-form-field appearance="outline">
  <mat-label>Starring</mat-label>
  <input matInput placeholder="Arnold Schwarzeneggar" />
</mat-form-field>
<mat-form-field appearance="outline">
  <mat-label>Release Date</mat-label>
  <input matInput placeholder="1985" />
</mat-form-field>
<mat-dialog-actions>
  <button matButton mat-dialog-close>Submit</button>
</mat-dialog-actions>
  <mat-dialog-actions>
    <button matButton mat-dialog-close>Cancel</button>
  </mat-dialog-actions>
